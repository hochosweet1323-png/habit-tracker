<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Привычки & Вода</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --subtext: #888;
    --accent: #6c63ff;
    --accent2: #48b0f7;
    --water: #48b0f7;
    --success: #4caf8a;
    --danger: #ff6b6b;
    --border: #e8e8e8;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #6c63ff 0%, #48b0f7 100%);
    padding: 20px 16px 24px;
    color: white;
    position: relative;
  }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .header .date { font-size: 13px; opacity: 0.85; }
  .header .streak {
    position: absolute; right: 16px; top: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px; padding: 6px 12px;
    font-size: 13px; font-weight: 600;
  }

  /* WATER CARD */
  .water-card {
    margin: -16px 16px 16px;
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .water-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
    color: var(--accent2);
  }
  .water-glasses {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .glass {
    width: 36px; height: 36px; border-radius: 10px;
    border: 2px solid var(--accent2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; transition: all 0.2s;
    background: white;
  }
  .glass.filled { background: var(--accent2); border-color: var(--accent2); }
  .glass.filled::after { content: '💧'; font-size: 16px; }
  .glass:not(.filled)::after { content: '○'; color: var(--accent2); font-size: 16px; }
  .water-progress {
    height: 6px; background: #e8f4fd; border-radius: 3px; overflow: hidden;
  }
  .water-fill {
    height: 100%; background: var(--accent2); border-radius: 3px;
    transition: width 0.3s ease;
  }
  .water-label {
    font-size: 12px; color: var(--subtext); margin-top: 6px; text-align: right;
  }

  /* SECTION */
  .section { padding: 0 16px; margin-bottom: 16px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .add-btn {
    background: var(--accent); color: white;
    border: none; border-radius: 20px;
    padding: 6px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
  }

  /* HABIT CARD */
  .habit-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .habit-card:active { transform: scale(0.98); }
  .habit-check {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2.5px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }
  .habit-card.done .habit-check {
    background: var(--success); border-color: var(--success);
  }
  .habit-card.done .habit-check::after { content: '✓'; color: white; font-size: 16px; font-weight: 700; }
  .habit-card:not(.done) .habit-check::after { content: ''; }
  .habit-info { flex: 1; }
  .habit-name { font-size: 15px; font-weight: 600; }
  .habit-streak { font-size: 12px; color: var(--subtext); margin-top: 2px; }
  .habit-emoji { font-size: 22px; flex-shrink: 0; }
  .habit-delete {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #ddd; font-size: 18px; cursor: pointer;
    padding: 4px; display: none;
  }
  .habit-card:hover .habit-delete { display: block; }

  /* EDIT MODE */
  .edit-mode .habit-delete { display: block !important; color: var(--danger); }

  /* STATS */
  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card); border-radius: 14px;
    padding: 14px 10px; text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--subtext); margin-top: 2px; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 env(safe-area-inset-bottom);
    z-index: 100;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px; padding: 6px;
    background: none; border: none; cursor: pointer;
    color: var(--subtext); font-size: 11px;
    transition: color 0.15s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 22px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    width: 100%; max-width: 480px;
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .modal input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--border); border-radius: 12px;
    font-size: 16px; margin-bottom: 12px;
    outline: none; transition: border-color 0.2s;
  }
  .modal input:focus { border-color: var(--accent); }
  .emoji-grid {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  }
  .emoji-opt {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--bg); border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer; transition: all 0.15s;
  }
  .emoji-opt.selected { border-color: var(--accent); background: #f0eeff; }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 13px; border-radius: 12px;
    background: var(--bg); border: none; font-size: 15px;
    font-weight: 600; cursor: pointer; color: var(--subtext);
  }
  .btn-save {
    flex: 2; padding: 13px; border-radius: 12px;
    background: var(--accent); border: none; font-size: 15px;
    font-weight: 600; cursor: pointer; color: white;
  }

  /* PAGE */
  .page { display: none; }
  .page.active { display: block; }

  /* WEEK VIEW */
  .week-row {
    display: flex; gap: 6px; margin-bottom: 16px;
  }
  .day-col {
    flex: 1; text-align: center;
  }
  .day-label { font-size: 11px; color: var(--subtext); margin-bottom: 4px; }
  .day-dot {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg); margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--subtext);
  }
  .day-dot.full { background: var(--success); color: white; font-size: 13px; }
  .day-dot.partial { background: #fff3cd; color: #856404; }
  .day-dot.today { border: 2px solid var(--accent); }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--subtext);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1 id="pageTitle">Мои привычки</h1>
  <div class="date" id="dateLabel"></div>
  <div class="streak" id="streakBadge">🔥 0 дней</div>
</div>

<!-- PAGES -->
<div id="page-today" class="page active">

  <!-- WATER CARD -->
  <div class="water-card">
    <div class="water-title">💧 Вода сегодня</div>
    <div class="water-glasses" id="waterGlasses"></div>
    <div class="water-progress"><div class="water-fill" id="waterFill"></div></div>
    <div class="water-label" id="waterLabel">0 из 8 стаканов</div>
  </div>

  <!-- HABITS -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Привычки</div>
      <button class="add-btn" onclick="openAddModal()">+ Добавить</button>
    </div>
    <div id="habitList"></div>
  </div>

</div>

<div id="page-stats" class="page">
  <div style="padding: 16px">
    <div class="section-title" style="margin-bottom:14px">📊 Статистика за неделю</div>
    <div class="stats-row" id="statsRow"></div>
    <div class="section-title" style="margin-bottom:12px">Последние 7 дней</div>
    <div class="week-row" id="weekRow"></div>
    <div id="habitStats"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('today', this)">
    <div class="nav-icon">✅</div>Сегодня
  </button>
  <button class="nav-btn" onclick="showPage('stats', this)">
    <div class="nav-icon">📊</div>Статистика
  </button>
</div>

<!-- ADD HABIT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Новая привычка</h3>
    <input type="text" id="habitNameInput" placeholder="Название привычки..." maxlength="30">
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveHabit()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['🏋️','🧘','🚶','🍎','📚','💊','🛌','🧹','🎨','🎯','💪','🥗','☕','🧴','🌿','🏃','🎵','✍️','🙏','💰'];
let selectedEmoji = '🎯';
let editMode = false;
let data = JSON.parse(localStorage.getItem('habitData') || '{}');

function todayKey() {
  return new Date().toISOString().slice(0,10);
}

function ensureToday() {
  const k = todayKey();
  if (!data[k]) data[k] = { water: 0, habits: {} };
  return data[k];
}

function save() {
  localStorage.setItem('habitData', JSON.stringify(data));
}

// Default habits
function getHabits() {
  if (!data.habits) {
    data.habits = [
      { id: 1, name: 'Тренировка', emoji: '🏋️', streak: 0 },
      { id: 2, name: 'Выпить воду', emoji: '💧', streak: 0 }
    ];
    save();
  }
  return data.habits;
}

// WATER
function renderWater() {
  const today = ensureToday();
  const count = today.water || 0;
  const goal = 8;
  const pct = Math.min(100, (count / goal) * 100);
  document.getElementById('waterFill').style.width = pct + '%';
  document.getElementById('waterLabel').textContent = count + ' из ' + goal + ' стаканов';
  const container = document.getElementById('waterGlasses');
  container.innerHTML = '';
  for (let i = 0; i < goal; i++) {
    const g = document.createElement('div');
    g.className = 'glass' + (i < count ? ' filled' : '');
    g.onclick = () => toggleWater(i);
    container.appendChild(g);
  }
}

function toggleWater(idx) {
  const today = ensureToday();
  const count = today.water || 0;
  if (idx < count) {
    today.water = idx;
  } else {
    today.water = idx + 1;
  }
  save();
  renderWater();
  if (window.Telegram?.WebApp) Telegram.WebApp.HapticFeedback.impactOccurred('light');
}

// HABITS
function renderHabits() {
  const habits = getHabits();
  const today = ensureToday();
  const list = document.getElementById('habitList');

  if (habits.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big">🌱</div><p>Нет привычек.<br>Добавь первую!</p></div>';
    return;
  }

  list.innerHTML = '';
  habits.forEach(h => {
    const done = !!today.habits[h.id];
    const card = document.createElement('div');
    card.className = 'habit-card' + (done ? ' done' : '') + (editMode ? ' edit-mode' : '');
    card.innerHTML = `
      <div class="habit-check"></div>
      <div class="habit-info">
        <div class="habit-name">${h.name}</div>
        <div class="habit-streak">🔥 ${h.streak} дней подряд</div>
      </div>
      <div class="habit-emoji">${h.emoji}</div>
      <button class="habit-delete" onclick="deleteHabit(event,${h.id})">✕</button>
    `;
    card.querySelector('.habit-check').onclick = () => toggleHabit(h.id);
    card.querySelector('.habit-info').onclick = () => toggleHabit(h.id);
    card.querySelector('.habit-emoji').onclick = () => toggleHabit(h.id);
    list.appendChild(card);
  });
}

function toggleHabit(id) {
  const today = ensureToday();
  const habits = getHabits();
  const h = habits.find(x => x.id === id);
  if (!h) return;
  if (today.habits[id]) {
    delete today.habits[id];
    if (h.streak > 0) h.streak--;
  } else {
    today.habits[id] = true;
    h.streak++;
  }
  save();
  renderHabits();
  renderStreak();
  if (window.Telegram?.WebApp) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
}

function deleteHabit(e, id) {
  e.stopPropagation();
  data.habits = getHabits().filter(h => h.id !== id);
  save();
  renderHabits();
}

// STREAK
function renderStreak() {
  const habits = getHabits();
  const maxStreak = habits.length ? Math.max(...habits.map(h => h.streak), 0) : 0;
  document.getElementById('streakBadge').textContent = '🔥 ' + maxStreak + ' дней';
}

// ADD MODAL
function openAddModal() {
  selectedEmoji = '🎯';
  document.getElementById('habitNameInput').value = '';
  renderEmojiGrid();
  document.getElementById('addModal').classList.add('show');
}

function closeModal() {
  document.getElementById('addModal').classList.remove('show');
}

function renderEmojiGrid() {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = '';
  EMOJIS.forEach(e => {
    const btn = document.createElement('div');
    btn.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
    btn.textContent = e;
    btn.onclick = () => { selectedEmoji = e; renderEmojiGrid(); };
    grid.appendChild(btn);
  });
}

function saveHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) { document.getElementById('habitNameInput').focus(); return; }
  const habits = getHabits();
  const newId = Date.now();
  habits.push({ id: newId, name, emoji: selectedEmoji, streak: 0 });
  save();
  closeModal();
  renderHabits();
}

// STATS PAGE
function renderStats() {
  const habits = getHabits();
  const today = ensureToday();
  const doneToday = Object.keys(today.habits).length;
  const total = habits.length;
  const pct = total ? Math.round((doneToday/total)*100) : 0;
  const maxStreak = habits.length ? Math.max(...habits.map(h=>h.streak),0) : 0;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${doneToday}/${total}</div><div class="stat-label">Сегодня</div></div>
    <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">Выполнено</div></div>
    <div class="stat-card"><div class="stat-num">${maxStreak}</div><div class="stat-label">Макс. серия</div></div>
  `;

  // Week
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const weekRow = document.getElementById('weekRow');
  weekRow.innerHTML = '';
  const todayStr = todayKey();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0,10);
    const dayData = data[k];
    const habitCount = dayData ? Object.keys(dayData.habits||{}).length : 0;
    const isToday = k === todayStr;
    const isFull = total > 0 && habitCount >= total;
    const isPartial = habitCount > 0 && !isFull;
    const col = document.createElement('div');
    col.className = 'day-col';
    col.innerHTML = `
      <div class="day-label">${days[d.getDay() === 0 ? 6 : d.getDay()-1]}</div>
      <div class="day-dot${isFull?' full':isPartial?' partial':''}${isToday?' today':''}">${isFull?'✓':habitCount||''}</div>
    `;
    weekRow.appendChild(col);
  }

  // Per-habit stats
  const hs = document.getElementById('habitStats');
  hs.innerHTML = '<div class="section-title" style="margin:16px 0 10px">По привычкам</div>';
  habits.forEach(h => {
    let count7 = 0;
    for (let i=0;i<7;i++) {
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=d.toISOString().slice(0,10);
      if (data[k]?.habits?.[h.id]) count7++;
    }
    const pct7 = Math.round((count7/7)*100);
    hs.innerHTML += `
      <div class="habit-card" style="cursor:default">
        <div class="habit-emoji">${h.emoji}</div>
        <div class="habit-info">
          <div class="habit-name">${h.name}</div>
          <div class="habit-streak">${count7}/7 дней · 🔥 ${h.streak} дней серия</div>
        </div>
        <div style="font-size:15px;font-weight:700;color:var(--accent)">${pct7}%</div>
      </div>
    `;
  });
}

// NAV
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if (name==='stats') { renderStats(); document.getElementById('pageTitle').textContent='Статистика'; }
  else { document.getElementById('pageTitle').textContent='Мои привычки'; }
}

// DATE
function setDate() {
  const d = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  document.getElementById('dateLabel').textContent = d.toLocaleDateString('ru-RU', opts);
}

// TELEGRAM
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// INIT
setDate();
renderWater();
renderHabits();
renderStreak();
</script>
</body>
</html>
